<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <meta name="description" content="اكتشف الخبر داخل تطبيق ApliNews واحصل على تجربة أخبار ذكية ومخصصة.">
    <meta property="og:title" content="ApliNews — أخبارك بذكاء">
    <meta property="og:description" content="افتح هذا الخبر داخل تطبيق ApliNews لتجربة أخبار ذكية ومخصصة.">
    <meta property="og:type" content="website">
    <title>ApliNews — افتح الخبر في التطبيق</title>
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        :root {
            --fallback-ink: #0F172A;
            --fallback-muted: #64748B;
            --fallback-line: rgba(148, 163, 184, 0.24);
            --fallback-glow: rgba(20, 184, 166, 0.24);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 88% 8%, rgba(20, 184, 166, 0.18), transparent 28rem),
                linear-gradient(145deg, #F8FAFC 0%, #EEF5F5 52%, #E6F3F1 100%);
        }

        .fallback-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .fallback-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            padding: 1.25rem 5%;
        }

        .fallback-logo {
            color: var(--fallback-ink);
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .fallback-logo span { color: var(--electric-teal); }

        .header-link {
            color: var(--fallback-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .header-link:hover { color: var(--teal-dark); }

        .fallback-main {
            flex: 1;
            display: flex;
            align-items: center;
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 5% 5rem;
        }

        .fallback-grid {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr);
            align-items: center;
            gap: clamp(2.5rem, 7vw, 7rem);
        }

        .fallback-copy { max-width: 620px; }

        .fallback-kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--teal-dark);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-bottom: 1.15rem;
        }

        .fallback-kicker::before {
            content: '';
            width: 2rem;
            height: 2px;
            background: var(--electric-teal);
        }

        .fallback-copy h1 {
            color: var(--fallback-ink);
            font-size: clamp(2.25rem, 5vw, 4.4rem);
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 1.2rem;
        }

        .fallback-copy h1 span { color: var(--teal-dark); }

        .fallback-lead {
            max-width: 530px;
            color: #475569;
            font-size: clamp(1rem, 1.8vw, 1.18rem);
            line-height: 1.9;
            margin-bottom: 1.8rem;
        }

        .fallback-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.1rem;
        }

        .fallback-actions .btn {
            min-height: 52px;
            justify-content: center;
            padding-inline: 1.35rem;
        }

        .play-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            min-height: 52px;
            padding: 0.45rem 1.05rem 0.45rem 1.2rem;
            border: 1px solid var(--fallback-line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--fallback-ink);
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .play-button:hover {
            color: var(--fallback-ink);
            border-color: rgba(20, 184, 166, 0.65);
            box-shadow: 0 10px 28px var(--fallback-glow);
            transform: translateY(-2px);
        }

        .play-icon {
            display: grid;
            place-items: center;
            width: 1.9rem;
            height: 1.9rem;
            border-radius: 50%;
            background: var(--deep-slate);
            color: var(--electric-teal);
            font-size: 0.8rem;
        }

        .play-button small {
            display: block;
            color: var(--fallback-muted);
            font-size: 0.65rem;
            font-weight: 600;
            line-height: 1.2;
            text-align: right;
        }

        .play-button strong { display: block; font-size: 0.92rem; }

        .fallback-note {
            color: var(--fallback-muted);
            font-size: 0.82rem;
            margin: 0;
        }

        .fallback-visual {
            position: relative;
            display: flex;
            justify-content: center;
            isolation: isolate;
        }

        .fallback-visual::before {
            content: '';
            position: absolute;
            inset: 10% -8% 4%;
            z-index: -1;
            border-radius: 50%;
            background: radial-gradient(circle, var(--fallback-glow), transparent 68%);
            filter: blur(8px);
        }

        .phone-card {
            position: relative;
            width: min(100%, 310px);
            padding: 0.55rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 26px;
            background: rgba(15, 23, 42, 0.94);
            box-shadow: 0 26px 60px rgba(15, 23, 42, 0.24), 0 0 0 10px rgba(255, 255, 255, 0.35);
            transform: rotate(2.5deg);
        }

        .phone-card img {
            display: block;
            width: 100%;
            border-radius: 21px;
        }

        .visual-badge {
            position: absolute;
            right: -1.25rem;
            bottom: 1.8rem;
            max-width: 180px;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--fallback-ink);
            font-size: 0.8rem;
            font-weight: 700;
            line-height: 1.5;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
            transform: rotate(-2.5deg);
        }

        .visual-badge span { color: var(--teal-dark); }

        .fallback-footer {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            padding: 1.25rem 5%;
            border-top: 1px solid var(--fallback-line);
            color: var(--fallback-muted);
            font-size: 0.78rem;
        }

        .fallback-footer a { color: inherit; }
        .fallback-footer a:hover { color: var(--teal-dark); }

        .generic-404 { display: none; }
        .is-generic .article-fallback { display: none; }
        .is-generic .generic-404 { display: block; }

        @media (max-width: 760px) {
            .fallback-header { padding-top: 1rem; }
            .header-link { font-size: 0.78rem; }
            .fallback-main { align-items: flex-start; padding-top: 2.5rem; }
            .fallback-grid { grid-template-columns: 1fr; gap: 3rem; }
            .fallback-copy { text-align: center; margin: 0 auto; }
            .fallback-kicker { justify-content: center; }
            .fallback-lead { margin-inline: auto; }
            .fallback-actions { justify-content: center; }
            .fallback-note { max-width: 340px; margin-inline: auto; }
            .fallback-visual { order: -1; }
            .phone-card { width: min(68vw, 260px); }
            .visual-badge { right: -1rem; bottom: 1rem; }
            .fallback-footer { flex-direction: column; text-align: center; align-items: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
            .phone-card, .visual-badge { transform: none; }
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            background: #07142D;
            color: #FFFFFF;
        }

        .fallback-shell {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 2rem 1.25rem;
            background:
                radial-gradient(ellipse at 50% 28%, rgba(28, 104, 230, 0.3), transparent 37rem),
                radial-gradient(ellipse at 50% 100%, rgba(8, 45, 96, 0.52), transparent 32rem),
                #07142D;
        }

        .fallback-main {
            width: 100%;
            max-width: 440px;
            margin: 0;
            padding: 0;
            display: grid;
            place-items: center;
        }

        .launch-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .launch-icon {
            position: relative;
            width: 132px;
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            margin-bottom: 1.65rem;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 32px;
            background: linear-gradient(145deg, #FFFFFF, #E7F1FF);
            box-shadow: 0 20px 56px rgba(0, 0, 0, 0.28), 0 0 48px rgba(43, 129, 255, 0.2);
            transform: rotate(-4deg);
        }

        .launch-icon::before,
        .launch-icon::after {
            content: '';
            position: absolute;
            width: 78px;
            height: 91px;
            border: 1px solid rgba(31, 104, 219, 0.2);
            border-radius: 9px;
            background: #D6E8FF;
        }

        .launch-icon::before {
            z-index: -2;
            transform: translate(9px, -7px) rotate(8deg);
        }

        .launch-icon::after {
            z-index: -1;
            transform: translate(5px, -3px) rotate(4deg);
            background: #EEF5FF;
        }

        .icon-page {
            position: relative;
            width: 78px;
            height: 91px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid #C5DAF8;
            border-radius: 9px;
            background: #FFFFFF;
            box-shadow: 0 5px 12px rgba(7, 20, 45, 0.1);
            transform: rotate(4deg);
        }

        .icon-letter {
            color: #1264D8;
            font-family: inherit;
            font-size: 2.5rem;
            font-weight: 850;
            line-height: 0.9;
        }

        .icon-rule {
            width: 42px;
            height: 3px;
            border-radius: 2px;
            background: #1877F2;
        }

        .icon-lines {
            width: 42px;
            height: 3px;
            border-radius: 2px;
            background: #C7D6E9;
            box-shadow: 0 6px 0 #C7D6E9;
        }

        .icon-accent {
            position: absolute;
            bottom: 11px;
            width: 11px;
            height: 4px;
            border-radius: 4px;
        }

        .icon-accent-red { right: 14px; background: #D92332; }
        .icon-accent-green { left: 14px; background: #167443; }

        .launch-icon {
            width: 116px;
            aspect-ratio: 1154 / 1173;
            margin-bottom: 1.2rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 25%;
            background: #FFFFFF;
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24), 0 0 42px rgba(43, 129, 255, 0.2);
        }

        .launch-icon::before,
        .launch-icon::after { display: none; }

        .app-icon-art {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .launch-actions .play-icon {
            width: 138px;
            height: 42px;
            flex: 0 0 138px;
            border-radius: 0;
        }

        .play-icon img { display: block; width: 100%; height: 100%; object-fit: contain; }

        .brand-name {
            margin: 0 0 1.15rem;
            color: #FFFFFF;
            font-size: 1.45rem;
            font-weight: 750;
            line-height: 1.2;
            letter-spacing: 0;
        }

        .brand-name span { color: #45A0FF; }

        .launch-heading {
            max-width: 390px;
            margin: 0 0 0.85rem;
            color: #FFFFFF;
            font-size: clamp(1.65rem, 7vw, 2.25rem);
            font-weight: 750;
            line-height: 1.5;
            letter-spacing: 0;
        }

        .launch-heading span { color: #56A8FF; }

        .launch-message {
            max-width: 340px;
            margin: 0 0 1.7rem;
            color: #B9C9E2;
            font-size: 0.98rem;
            line-height: 1.85;
        }

        .launch-actions {
            width: 100%;
            display: grid;
            gap: 0.75rem;
        }

        .launch-actions .btn,
        .launch-actions .play-button {
            width: 100%;
            min-height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
        }

        .launch-actions .btn-primary {
            border: 1px solid #5AA7FF;
            background: linear-gradient(105deg, #1469E8, #2789FF);
            color: #FFFFFF;
            box-shadow: 0 10px 26px rgba(25, 112, 235, 0.28);
        }

        .launch-actions .btn-primary:hover {
            background: linear-gradient(105deg, #0E5ED5, #1978EE);
            color: #FFFFFF;
        }

        .launch-actions .play-button {
            border: 1px solid rgba(181, 207, 243, 0.28);
            background: rgba(255, 255, 255, 0.045);
            color: #EAF2FF;
            box-shadow: none;
        }

        .launch-actions .play-button:hover {
            border-color: rgba(113, 175, 255, 0.72);
            background: rgba(42, 113, 209, 0.16);
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .launch-actions .play-button small { color: #A8BBD8; }

        .launch-actions .play-icon { background: transparent; }

        .generic-404 { display: none; }
        .is-generic .article-fallback { display: none; }
        .is-generic .generic-404 { display: flex; }

        @media (max-width: 480px) {
            .fallback-shell { padding: 1.5rem 1.35rem; }
            .launch-icon { width: 108px; margin-bottom: 1rem; }
            .launch-message { font-size: 0.94rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .launch-icon { transform: none; }
        }
    </style>
</head>
<body>
    <div class="fallback-shell">
        <main class="fallback-main">
            <section class="launch-content article-fallback" aria-labelledby="article-title">
                <div class="launch-icon" role="img" aria-label="أيقونة تطبيق ApliNews">
                    <img class="app-icon-art" src="/images/aplinewsicon.png" alt="">
                </div>
                <p class="brand-name" dir="ltr">Apli<span>News</span></p>
                <h1 class="launch-heading" id="article-title">هذا الخبر متوفر<br><span>على تطبيق ApliNews</span></h1>
                <p class="launch-message">إذا أردت قراءة هذا المقال، افتحه في تطبيق ApliNews لتكمل القراءة.</p>
                <div class="launch-actions">
                    <a id="open-in-app" class="btn btn-primary" href="/aplinews/article/" aria-label="افتح المقال في تطبيق ApliNews">افتح المقال في ApliNews</a>
                    <a class="play-button" href="https://play.google.com/store/apps/details?id=com.aplitiq.aplinews" target="_blank" rel="noopener noreferrer" aria-label="تحميل ApliNews من Google Play">
                        <span class="play-icon" aria-hidden="true">
                            <img src="/images/googleplayicon.png" alt="">
                        </span>
                        <span><small>تحميل التطبيق</small><strong>من Google Play</strong></span>
                    </a>
                </div>
            </section>

            <section class="launch-content generic-404" aria-labelledby="not-found-title">
                <p class="brand-name" dir="ltr">Apli<span>News</span></p>
                <h1 class="launch-heading" id="not-found-title">هذا الرابط غير متاح</h1>
                <p class="launch-message">تابع الأخبار واكتشف المزيد داخل تطبيق ApliNews.</p>
                <div class="launch-actions">
                    <a class="btn btn-primary" href="/aplinews/">تابع إلى ApliNews</a>
                </div>
            </section>
        </main>
    </div>

    <script>
        (function () {
            var articlePath = /^\/aplinews\/article\/([^/?#]+)\/?$/;
            var match = window.location.pathname.match(articlePath);
            var page = document.querySelector('.fallback-shell');
            var openInApp = document.getElementById('open-in-app');

            if (!match) {
                page.classList.add('is-generic');
                document.title = 'ApliNews — الصفحة غير موجودة';
                return;
            }

            var articleId = decodeURIComponent(match[1]);
            var articleUrl = window.location.href;
            page.dataset.articleId = articleId;
            document.body.dataset.articleId = articleId;
            openInApp.href = articleUrl;
        }());
    </script>
</body>
</html>
